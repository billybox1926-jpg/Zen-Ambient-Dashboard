<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen Ambient Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 30%, #1a2340, #0b0f1a);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f0f4fc;
      user-select: none;
    }

    .dashboard {
      text-align: center;
      width: 100%;
      max-width: 480px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .date { font-size: 1.1rem; color: #d0d8ec; }
    .weather {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 1rem;
      color: #b0bcd6;
    }

    /* Breathing circle */
    .breath-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff8c4a, #e0452e);
      box-shadow: 0 0 60px rgba(230, 70, 50, 0.35), 0 0 120px rgba(230, 70, 50, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 4s ease-in-out, box-shadow 2s ease;
      margin-bottom: 1.2rem;
    }

    .breath-circle.inhale {
      transform: scale(1.35);
      box-shadow: 0 0 90px rgba(255, 140, 74, 0.55), 0 0 160px rgba(230, 70, 50, 0.25);
    }

    .breath-circle.exhale {
      transform: scale(0.75);
      box-shadow: 0 0 40px rgba(230, 70, 50, 0.25);
    }

    .breath-circle span {
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    /* Closed-caption style instruction */
    .breath-instruction {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 3px;
      color: #f0f4fc;
      min-height: 2.2rem;
      margin-bottom: 2rem;
      opacity: 0.95;
      transition: opacity 0.3s ease;
    }

    .breath-instruction.idle {
      opacity: 0.5;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* Timer */
    .timer-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 2.2rem;
    }

    .timer-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 4;
    }

    .timer-progress {
      fill: none;
      stroke: #e86a4a;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 452.389;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.3s ease;
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 0.55rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.9rem;
      color: #d0d8ec;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }

    @media (max-width: 480px) {
      .breath-circle { width: 150px; height: 150px; }
      .breath-circle span { font-size: 1.1rem; }
      .breath-instruction { font-size: 1.35rem; }
      .timer-wrapper { width: 130px; height: 130px; }
      .timer-text { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

<div class="dashboard">
  <!-- Top -->
  <div class="top-bar">
    <div class="date" id="dateDisplay">—</div>
    <div class="weather">
      <span>⛅</span>
      <span id="tempDisplay">--°C</span>
    </div>
  </div>

  <!-- Breathing Circle -->
  <div class="breath-circle" id="breathCircle">
    <span id="circleLabel">BREATHE</span>
  </div>

  <!-- Closed-caption instruction text -->
  <div class="breath-instruction idle" id="breathInstruction">
    Click circle to begin guided breathing
  </div>

  <!-- Timer -->
  <div class="timer-wrapper">
    <svg class="timer-svg" viewBox="0 0 160 160">
      <circle class="timer-bg" cx="80" cy="80" r="72" />
      <circle class="timer-progress" id="timerProgress" cx="80" cy="80" r="72" />
    </svg>
    <div class="timer-text">
      <span id="timerDisplay">25:00</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="actions">
    <button class="btn" id="startBtn">
      <span>▶</span> Start
    </button>
    <button class="btn" id="resetBtn">
      <span>↻</span> Reset
    </button>
    <button class="btn" id="rainBtn">🌧️ Rain</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Elements
  const dateDisplay     = document.getElementById('dateDisplay');
  const tempDisplay     = document.getElementById('tempDisplay');
  const timerDisplay    = document.getElementById('timerDisplay');
  const progressCircle  = document.getElementById('timerProgress');
  const startBtn        = document.getElementById('startBtn');
  const resetBtn        = document.getElementById('resetBtn');
  const breathCircle    = document.getElementById('breathCircle');
  const circleLabel     = document.getElementById('circleLabel');
  const breathInstruction = document.getElementById('breathInstruction');
  const rainBtn         = document.getElementById('rainBtn');

  // --- Date ---
  function updateDate() {
    const now = new Date();
    dateDisplay.textContent = now.toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric'
    });
  }
  updateDate();
  setInterval(updateDate, 60000);
  tempDisplay.textContent = '--°C';

  // --- Timer (25 min) ---
  const TOTAL_SECONDS = 25 * 60;
  let remainingSeconds = TOTAL_SECONDS;
  let timerInterval = null;
  let isRunning = false;
  const CIRCUMFERENCE = 2 * Math.PI * 72;
  progressCircle.style.strokeDasharray = CIRCUMFERENCE;

  function updateTimerDisplay(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    timerDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    const fraction = seconds / TOTAL_SECONDS;
    progressCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    isRunning = false;
    remainingSeconds = TOTAL_SECONDS;
    updateTimerDisplay(remainingSeconds);
    startBtn.innerHTML = '<span>▶</span> Start';
    progressCircle.style.strokeDashoffset = 0;
  }

  function startTimer() {
    if (isRunning) {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.innerHTML = '<span>▶</span> Start';
      return;
    }
    if (remainingSeconds <= 0) resetTimer();
    isRunning = true;
    startBtn.innerHTML = '<span>⏸</span> Pause';
    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateTimerDisplay(remainingSeconds);
      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.innerHTML = '<span>▶</span> Start';
        progressCircle.style.strokeDashoffset = CIRCUMFERENCE;
        timerDisplay.textContent = '00:00';
      }
    }, 1000);
  }

  startBtn.addEventListener('click', startTimer);
  resetBtn.addEventListener('click', resetTimer);

  // --- Guided 4-7-8 Breathing with closed captions ---
  let breathActive = false;
  let breathTimeout = null;

  function delay(ms) {
    return new Promise(resolve => {
      breathTimeout = setTimeout(resolve, ms);
    });
  }

  async function runBreathingCycle() {
    while (breathActive) {
      // INHALE 4s
      breathCircle.classList.remove('exhale');
      breathCircle.classList.add('inhale');
      circleLabel.textContent = 'INHALE';
      breathInstruction.textContent = 'Inhale slowly through your nose';
      breathInstruction.classList.remove('idle');
      await delay(4000);
      if (!breathActive) break;

      // HOLD 7s
      circleLabel.textContent = 'HOLD';
      breathInstruction.textContent = 'Hold your breath';
      await delay(7000);
      if (!breathActive) break;

      // EXHALE 8s
      breathCircle.classList.remove('inhale');
      breathCircle.classList.add('exhale');
      circleLabel.textContent = 'EXHALE';
      breathInstruction.textContent = 'Exhale slowly through your mouth';
      await delay(8000);
    }
  }

  function stopBreathing() {
    breathActive = false;
    clearTimeout(breathTimeout);
    breathCircle.classList.remove('inhale', 'exhale');
    circleLabel.textContent = 'BREATHE';
    breathInstruction.textContent = 'Click circle to begin guided breathing';
    breathInstruction.classList.add('idle');
  }

  breathCircle.addEventListener('click', () => {
    if (breathActive) {
      stopBreathing();
    } else {
      breathActive = true;
      runBreathingCycle();
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) {
      e.preventDefault();
      startTimer();
    }
    if (e.code === 'KeyR' && !e.repeat) resetTimer();
  });

  // --- Ambient rain (procedural Web Audio) ---
  let audioCtx = null;
  let rainGain = null;
  let rainActive = false;
  let rainSource = null;
  let rainNodes = null;

  function buildRain(ctx) {
    const bufSize = 2 * ctx.sampleRate;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const lo = ctx.createBiquadFilter();
    lo.type = 'lowpass';
    lo.frequency.value = 1400;
    lo.Q.value = 0.5;

    const hi = ctx.createBiquadFilter();
    hi.type = 'highpass';
    hi.frequency.value = 280;
    hi.Q.value = 0.4;

    src.connect(lo);
    lo.connect(hi);
    return { src, out: hi };
  }

  async function toggleRain() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    if (rainActive) {
      if (rainGain) {
        rainGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.4);
      }
      const stopLater = () => {
        try { rainSource && rainSource.stop(); } catch (_) {}
        rainSource = null;
        rainNodes = null;
      };
      setTimeout(stopLater, 1200);
      rainActive = false;
      rainBtn.textContent = '🌧️ Rain';
      rainBtn.classList.remove('active');
      return;
    }

    const { src, out } = buildRain(audioCtx);
    rainGain = audioCtx.createGain();
    rainGain.gain.setValueAtTime(0, audioCtx.currentTime);
    rainGain.gain.setTargetAtTime(0.35, audioCtx.currentTime, 0.8);
    out.connect(rainGain);
    rainGain.connect(audioCtx.destination);
    src.start(0);

    rainSource = src;
    rainNodes = { src, out, rainGain };
    rainActive = true;
    rainBtn.textContent = '🔇 Mute';
    rainBtn.classList.add('active');
  }

  rainBtn.addEventListener('click', toggleRain);

  // Init
  resetTimer();
  console.log('Zen Ambient Dashboard ready – guided breathing + captions enabled');
})();
</script>
</body>
</html>
